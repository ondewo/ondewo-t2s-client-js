name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The proto-compiler regen rewrites package.json from its own template, and
      # `make restore_ci_test_setup` merges the CI scripts/deps back in from .ci-package.json. This step
      # turns any drift between the two into a red build on the commit that introduced it, and runs
      # BEFORE the tests so a mismatch fails fast.
      - name: Guard the package.json <-> .ci-package.json mirror
        run: npm run test:drift

      # The repo is ~95% generated gRPC/protobuf stubs; coverage is gated on the HAND-WRITTEN surface
      # only -- both of its sources: auth/offlineTokenProvider.js (the D18 Keycloak offline-token auth
      # provider) and examples/client.js. Every spec runs in ONE c8 process at a 100%
      # statement/branch/function/line threshold, `--per-file` so no file can be averaged away, and
      # `--all` so a new hand-written file under auth/ or examples/ that no test requires cannot sit at
      # 0% unnoticed. Generated stubs (api/), the submodules and the *.spec.js files are out of scope.
      - name: Unit tests + 100% coverage gate on the hand-written code
        run: npm test
